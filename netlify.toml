[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[redirects]]
  from = "http://derkrieger.at/*"
  to = "https://derkrieger.at/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.derkrieger.at/*"
  to = "https://derkrieger.at/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.derkrieger.at/*"
  to = "https://derkrieger.at/:splat"
  status = 301
  force = true
