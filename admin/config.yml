backend:
  name: git-gateway
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

locale: de

collections:
  - name: settings
    label: "⚙️ Einstellungen"
    files:
      - name: settings
        label: Website-Einstellungen
        file: content/settings.json
        format: json
        fields:
          - {label: Hero Untertitel, name: hero_subtitle, widget: string}
          - {label: Hero Claim, name: hero_claim, widget: text}
          - label: Statistiken
            name: stats
            widget: object
            fields:
              - {label: Anzahl Episoden, name: episodes, widget: number}
              - {label: "Follower (z.B. 4.8k)", name: followers, widget: string}
              - {label: Jahre on Stage, name: years, widget: number}
              - {label: "Impact Label (z.B. ∞)", name: impact, widget: string}
          - {label: Podcast Cover Bild, name: podcast_cover, widget: image}
          - {label: Spotify URL, name: spotify_url, widget: string}
          - {label: YouTube URL, name: youtube_url, widget: string}
          - {label: Apple Podcasts URL, name: apple_url, widget: string}

  - name: podcast
    label: "🎙 Podcast Episoden"
    files:
      - name: episodes
        label: Alle Episoden
        file: content/episodes.json
        format: json
        fields:
          - label: Episoden
            name: episodes
            widget: list
            summary: "#{{fields.number}} — {{fields.title}}"
            fields:
              - {label: Nummer, name: number, widget: number}
              - {label: Titel, name: title, widget: string}
              - {label: Kurzbeschreibung, name: description, widget: text}
              - {label: Dauer in Minuten, name: duration, widget: number}
              - {label: Als NEU markieren, name: is_new, widget: boolean, default: false}
              - {label: Sichtbar auf Website, name: visible, widget: boolean, default: true}
              - {label: YouTube Link, name: youtube_url, widget: string, required: false}
              - {label: Spotify Link, name: spotify_url, widget: string, required: false}

  - name: events
    label: "📅 Events & Termine"
    files:
      - name: events
        label: Alle Events
        file: content/events.json
        format: json
        fields:
          - label: Events
            name: events
            widget: list
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - {label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false}
              - {label: Titel, name: title, widget: string}
              - {label: Location, name: location, widget: string}
              - label: Status
                name: status
                widget: select
                options:
                  - {label: "✅ Tickets verfügbar", value: available}
                  - {label: "⚠️ Fast ausverkauft", value: limited}
                  - {label: "❌ Ausverkauft", value: sold_out}
              - {label: "Ticket Link (leer = kein Button)", name: ticket_url, widget: string, required: false}

  - name: blog
    label: "✍️ Blog Artikel"
    files:
      - name: posts
        label: Alle Artikel
        file: content/blog.json
        format: json
        fields:
          - label: Artikel
            name: posts
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Titel, name: title, widget: string}
              - {label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false}
              - {label: "Kategorie (z.B. Identität)", name: category, widget: string}
              - {label: Kurztext für Vorschau, name: excerpt, widget: text}
              - {label: Titelbild, name: image, widget: image}
              - {label: Inhalt, name: content, widget: markdown}
              - {label: Sichtbar auf Website, name: visible, widget: boolean, default: true}
